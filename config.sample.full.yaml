# yaml-language-server: $schema=https://raw.githubusercontent.com/wtnb75/gilterweb/refs/heads/main/schema.json

server:
  network: tcp
  addr: ":8888"
  request_timeout: 10s
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 5s
  max_body_size: 1048576
  max_filter_output_size: 10485760

log:
  level: info
  format: json

# Global response compression (gzip)
compression:
  enabled: true
  min_size: 256
  level: 5
  types:
    - application/json
    - text/plain
    - text/html
  algorithms:
    - gzip

filters:
  # 1) static: build request summary from request context
  #    Headers are accessible in two ways:
  #      - underscore form: .req.headers.user_agent  (dash replaced by underscore, lowercased)
  #      - original form:   index .req.headers "User-Agent"
  #    Cookies are accessible via .req.cookies.(name)
  - id: REQ_SUMMARY
    type: static
    params:
      method: "{{ .req.method }}"
      path: "{{ .req.path }}"
      host: "{{ .req.host }}"
      user_agent: "{{ default \"unknown\" .req.headers.user_agent }}"
      accept_encoding: "{{ .req.headers.accept_encoding }}"
      request_id: "{{ default \"none\" .req.headers.x_request_id }}"
      # request cookies: .req.cookies.(name)
      session_cookie: "{{ default \"\" .req.cookies.session }}"

  # 2) env: read env var with fallback
  - id: ENV_HOME
    type: env
    params:
      name: HOME
      default: /tmp

  # 3) exec: run local shell command
  #    env values support template expansion just like command args
  - id: EXEC_ECHO
    type: exec
    params:
      command:
        - sh
        - -c
        - "printf 'home:%s path:%s' \"$GW_HOME\" \"$GW_PATH\""
      timeout: 2s
      env:
        GW_HOME: "{{ .ENV_HOME }}"
        GW_PATH: "{{ .req.path }}"

  # 4) file: read workspace file as plain text
  - id: FILE_GOMOD
    type: file
    params:
      path: ./go.mod
      parse: text

  # 5) base64 encode/decode
  - id: B64_ENCODE_PATH
    type: base64
    params:
      op: encode
      input: "{{ .REQ_SUMMARY.path }}"

  - id: B64_DECODE_PATH
    type: base64
    params:
      op: decode
      input: "{{ .B64_ENCODE_PATH }}"

  # 6) regex find + replace
  - id: REGEX_FIND
    type: regex
    params:
      input: "{{ .B64_DECODE_PATH }}"
      pattern: "^/(?P<first>[^/]+)"
      op: find

  - id: REGEX_REWRITE
    type: regex
    params:
      input: "{{ .B64_DECODE_PATH }}"
      pattern: "^/"
      op: replace
      replace: "path:"

  # 7) jq: parse JSON string and extract fields
  - id: JQ_SOURCE
    type: static
    params: "{\"path\":\"{{ .B64_DECODE_PATH }}\",\"home\":\"{{ .ENV_HOME
      }}\",\"ok\":true}"

  - id: JQ_SELECT
    type: jq
    params:
      input: "{{ .JQ_SOURCE }}"
      query: "{path: .path, ok: .ok}"

  # 8) cache: cache result of another filter
  - id: CACHED_EXEC
    type: cache
    params:
      filter: EXEC_ECHO
      ttl: 30s
      key: "{{ .REQ_SUMMARY.path }}:{{ default \"/tmp\" .ENV_HOME }}"

  # 9) http: call external endpoint
  #    url, method, unix_socket, and header values all support template expansion.
  #    This example forwards the incoming Cookie header and host to the upstream.
  - id: HTTP_ECHO
    type: http
    params:
      method: POST
      url: "https://httpbin.org/anything{{ .req.path }}"
      headers:
        Content-Type: application/json
        # forward incoming Cookie header to upstream
        Cookie: "{{ .req.headers.cookie }}"
        X-Forwarded-Host: "{{ .req.host }}"
      body: "{\"path\":\"{{ .req.path }}\",\"from\":\"gilterweb\"}"

  # 10) path params: dynamic endpoint variables from URL
  - id: PATH_PARAM_VIEW
    type: static
    params:
      route: "{{ .req.path }}"
      user_id: "{{ default \"unknown\" (index .req.path_params \"id\") }}"
      section: "{{ default \"none\" (index .req.path_params \"section\") }}"
      note: "values are from .req.path_params"

  # 11) http: upstream that sets response cookies
  #     Demonstrates forwarding a request cookie and receiving a response cookie.
  - id: HTTP_WITH_COOKIES
    type: http
    params:
      method: GET
      url: "https://httpbin.org/cookies/set/demo/value"
      headers:
        # forward session cookie from incoming request
        Cookie: "{{ .req.cookies.session }}"

  # 12) static: access response cookies and headers from HTTP_WITH_COOKIES
  #     Response cookies:  .(filter_id).cookies.(name)
  #     Response headers:  .(filter_id).headers.(name_with_underscores)
  #                     or index .(filter_id).headers "Original-Name"
  - id: COOKIE_RESULT
    type: static
    params:
      demo_cookie: "{{ .HTTP_WITH_COOKIES.cookies.demo }}"
      content_type: "{{ .HTTP_WITH_COOKIES.headers.content_type }}"
      upstream_status: "{{ .HTTP_WITH_COOKIES.status }}"

  # Final composed response
  - id: RESPONSE_ALL
    type: static
    params:
      request:
        method: "{{ .REQ_SUMMARY.method }}"
        path: "{{ .REQ_SUMMARY.path }}"
        accept_encoding: "{{ .REQ_SUMMARY.accept_encoding }}"
        session_cookie: "{{ .REQ_SUMMARY.session_cookie }}"
      env_home: "{{ .ENV_HOME }}"
      exec_stdout: "{{ .CACHED_EXEC.stdout }}"
      file_preview: "{{ .FILE_GOMOD | trimSpace }}"
      base64:
        encoded: "{{ .B64_ENCODE_PATH }}"
        decoded: "{{ .B64_DECODE_PATH }}"
      regex:
        first_segment: "{{ .REGEX_FIND.first }}"
        rewritten: "{{ .REGEX_REWRITE }}"
      jq_result: "{{ toJson .JQ_SELECT }}"
      http_status: "{{ .HTTP_ECHO.status }}"
      http_raw: "{{ .HTTP_ECHO.raw }}"

paths:
  # Most features in one request (includes external HTTP filter)
  - method: GET
    path: /demo/all
    filter: RESPONSE_ALL

  # Local-only path (no external HTTP dependency)
  - method: GET
    path: /demo/local
    filter: JQ_SELECT

  # Cache demonstration
  - method: GET
    path: /demo/cache
    filter: CACHED_EXEC

  # Path parameter examples
  - method: GET
    path: /demo/users/{id}
    filter: PATH_PARAM_VIEW

  - method: GET
    path: /demo/users/{id}/{section}
    filter: PATH_PARAM_VIEW

  # Static route wins over parameterized route
  - method: GET
    path: /demo/users/me
    filter: JQ_SELECT

  # Compression override example: disable only for this path
  - method: GET
    path: /demo/nocompress
    filter: RESPONSE_ALL
    compression:
      enabled: false

  # Cookie forwarding and response cookie access demonstration
  - method: GET
    path: /demo/cookies
    filter: COOKIE_RESULT
